<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OtakuStreams Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
        }
        html, body, #player-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="player-container"></div>
    <script>
        // Parse URL query parameters
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('id');
        const episode = params.get('ep') || '1';
        const audio = params.get('audio') || 'sub';
        const server = params.get('server') || 'hd-1';
        const malId = params.get('malId');

        const container = document.getElementById('player-container');

        if (animeId) {
            let streamUrl = '';
            const isMalOnly = animeId.startsWith('mal-');

            if (server === 'hd-3') {
                // Server 3: ZokoAnime (ani by default, or mal if mal- id)
                const source = isMalOnly ? 'mal' : 'ani';
                const cleanId = isMalOnly ? animeId.replace('mal-', '') : animeId;
                streamUrl = `https://zokoanime.video/stream/${source}/${cleanId}/${episode}/${audio}?color=6366f1&autoplay=true`;
            } else {
                // Server 1 & Server 2: MegaPlay (hd-1 = ani, hd-2 = mal)
                const isMal = isMalOnly || (malId && malId !== 'null' && malId !== 'undefined' && server === 'hd-2');
                const cleanId = isMal ? (isMalOnly ? animeId.replace('mal-', '') : malId) : animeId;
                const typePath = isMal ? 'mal' : 'ani';
                streamUrl = `https://megaplay.buzz/stream/${typePath}/${cleanId}/${episode}/${audio}`;
            }

            const iframe = document.createElement('iframe');
            iframe.src = streamUrl;
            iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.className = 'player-iframe';

            container.appendChild(iframe);
        } else {
            container.innerHTML = '<div style="color: #ef4444; font-family: sans-serif; font-size: 14px; text-align: center; padding: 20px;">Invalid or missing stream parameters.</div>';
        }

        // Anti-clickjacking ad redirection shield
        window.open = function() { return null; };
        
        document.addEventListener('click', function(e) {
            const tag = e.target.tagName.toLowerCase();
            const href = e.target.href || '';
            const isAllowedHref = href.includes('megaplay.buzz') || href.includes('zokoanime.video');
            if (tag === 'a' && !isAllowedHref) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // Periodically sanitize target blank links
        setInterval(function() {
            const anchors = document.getElementsByTagName('a');
            for (let i = 0; i < anchors.length; i++) {
                if (anchors[i].getAttribute('target') === '_blank') {
                    anchors[i].removeAttribute('target');
                    anchors[i].href = 'javascript:void(0);';
                }
            }
        }, 1000);

        // Secure player postMessage event bridge
        window.addEventListener('message', function(event) {
            // Origin validation
            if (event.origin) {
                const origin = event.origin.toLowerCase();
                const isAllowedOrigin = origin.includes('megaplay.buzz') || 
                                       origin.includes('megacloud.tv') || 
                                       origin.includes('megacloud.club') || 
                                       origin.includes('megacloud') || 
                                       origin.includes('anikoto') ||
                                       origin.includes('zokoanime.video') ||
                                       origin.includes('zokoanime');
                const isLocal = origin === window.location.origin;
                if (!isAllowedOrigin && !isLocal) {
                    return;
                }
            }

            let data = event.data;
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    return;
                }
            }

            if (!data || typeof data !== 'object') {
                return;
            }

            // Accept only recognized MegaPlay player events
            const eventName = data.event || data.type;
            const isRecognized = 
                eventName === 'time' || 
                eventName === 'complete' || 
                eventName === 'ended' ||
                eventName === 'watching-log' || 
                eventName === 'error' ||
                data.channel === 'megacloud';

            if (!isRecognized) {
                return;
            }

            // Forward normalized event payload to parent window (Watch.jsx)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'megaplay-bridge',
                    event: data.event,
                    type: data.type,
                    time: data.time,
                    currentTime: data.currentTime,
                    duration: data.duration,
                    percent: data.percent,
                    channel: data.channel,
                    data: data.data
                }, '*');
            }
        });
    </script>
</body>
</html>
